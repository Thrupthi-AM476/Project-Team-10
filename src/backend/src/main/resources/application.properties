# ============================================================
# Vehicle Parking System - Application Configuration
# ============================================================

# Server
server.port=8080

# Database - update these values to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_parking_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# IMPORTANT: Change this secret before deploying. Use a strong random string.
app.jwt.secret=vps-secret-key-change-this-in-production-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

# CORS - allow React frontend (dev)
app.cors.allowed-origins=http://localhost:3000

# Logging - keep simple for academic project
logging.level.com.vps=INFO
logging.level.org.springframework.security=WARN
