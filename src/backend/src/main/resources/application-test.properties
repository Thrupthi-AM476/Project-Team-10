spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Both properties needed to ensure Hibernate uses H2 dialect (overrides MySQLDialect from application.properties)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Suppress MySQL-specific table options (engine=InnoDB) not understood by H2
spring.jpa.properties.hibernate.dialect.storage_engine=
app.jwt.secret=test-secret-key-for-vps-unit-tests-must-be-256-bits-long-padding
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000
logging.level.com.vps=WARN
